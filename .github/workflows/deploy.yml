name: Deploy

# Trunk-based na prática: todo commit que chega na main vai para produção.
# Sem branch de release, sem janela de deploy, sem passo manual.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois commits chegarem juntos, o mais novo vence e o anterior é cancelado.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar o site
        run: node scripts/validar.mjs

      - name: Gerar manifesto de participantes
        run: node scripts/gerar-manifesto.mjs

      - name: Registrar informações do build
        run: |
          printf '{\n  "commit": "%s",\n  "data": "%s"\n}\n' \
            "${GITHUB_SHA}" "$(date -u '+%d/%m/%Y %H:%M UTC')" > data/build.json

      - uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
